#################################
#          Rendimiento          #
#################################

# Backend recomendado para efectos fluidos (usa 'xrender' si tienes problemas con controladores de video)
backend = "xrender";
vsync = true;


#################################
#       Bordes Redondeados      #
#################################

# Radio de las esquinas en píxeles
corner-radius = 10;

# Evita redondear ciertas ventanas (como barras del sistema o menús emergentes)
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'IceWM'"
];


#################################
#         Transparencias        #
#################################

# Opacidad de ventanas inactivas y activas (0.0 a 1.0)
inactive-opacity = 0.90;
active-opacity = 1.0;

# Opacidad del marco/borde de las ventanas
frame-opacity = 0.8;

# Permitir que las reglas de opacidad individual anulen inactive-opacity
inactive-opacity-override = false;

# Reglas de opacidad específicas para aplicaciones
opacity-rule = [
  "90:class_g = 'URxvt'",
  "90:class_g = 'Alacritty'",
  "90:class_g = 'Kitty'",
  "95:class_g = 'Rofi'"
];


#################################
#      Transiciones / Fading    #
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;


#################################
#           Sombras             #
#################################

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'IceWM'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];
