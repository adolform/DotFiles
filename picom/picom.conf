#################################
#          Rendimiento          #
#################################

# Backend recomendado para efectos fluidos (usa 'xrender' si tienes problemas con controladores de video)
backend = "xrender";
vsync = true;

#################################
#           Sombras             #
#################################

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'IceWM'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];
